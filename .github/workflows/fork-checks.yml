# Contrôles propres au fork kesurof/Ether-Remix (jamais proposés à Aerya).
# - Format d'Aerya (docs/pse/FORK.fr.md, AGENTS.md) : un travail du fork doit
#   pouvoir passer sur Aerya/Ether-Remix sans réécriture.
# - Guides Discord : chaque message reste sous la limite de 1900 caractères.
name: Fork · contrôles

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format d'Aerya
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Les PR de synchronisation reprennent le code d'Aerya tel quel.
    if: ${{ !startsWith(github.head_ref, 'sync/') && !contains(github.head_ref, 'synchro') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Contrôle du format
        env:
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_format_aerya.py "origin/$BASE" "$TITLE"

  discord:
    name: Guides Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Limite des messages
        run: python3 scripts/check_discord.py
